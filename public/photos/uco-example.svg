<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04211c"/><stop offset="1" stop-color="#050a09"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.09)"/><stop offset="1" stop-color="rgba(255,255,255,.03)"/></linearGradient>
    <style>
      @keyframes caret { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes stepin { 0%,8% { opacity:0; transform: translateY(8px) } 18%,100% { opacity:1; transform: translateY(0) } }
      @keyframes scanline { 0% { transform: translateY(0) } 100% { transform: translateY(720px) } }
      @keyframes pulsedot { 0%,100% { opacity:.35; r:5 } 50% { opacity:1; r:7 } }
      @keyframes sweepglow { 0%,100% { opacity:.18 } 50% { opacity:.42 } }
      .step { animation: stepin 6s ease-out infinite; }
      .caret { animation: caret 1.1s step-end infinite; }
      .scan { animation: scanline 7s linear infinite; }
      .dot { animation: pulsedot 2.2s ease-in-out infinite; }
      .glow { animation: sweepglow 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .step,.caret,.scan,.dot,.glow { animation: none; opacity: 1; transform: none } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#ubg)"/>
  <g class="glow"><ellipse cx="640" cy="250" rx="520" ry="220" fill="#10b981" opacity=".2"/></g>

  <!-- desktop window behind -->
  <rect x="70" y="96" width="1140" height="560" rx="20" fill="rgba(255,255,255,.03)" stroke="rgba(16,185,129,.18)"/>
  <g fill="rgba(255,255,255,.16)"><circle cx="104" cy="126" r="7"/><circle cx="128" cy="126" r="7"/><circle cx="152" cy="126" r="7"/></g>
  <text x="640" y="132" font-size="17" fill="rgba(255,255,255,.42)" font-family="Inter,Arial,sans-serif" text-anchor="middle">Ableton Live 12.1</text>
  <g stroke="rgba(255,255,255,.06)">
    <line x1="70" y1="156" x2="1210" y2="156"/>
    <line x1="300" y1="156" x2="300" y2="656"/>
  </g>
  <g fill="rgba(255,255,255,.05)">
    <rect x="96" y="182" width="176" height="34" rx="7"/><rect x="96" y="228" width="176" height="34" rx="7"/>
    <rect x="96" y="274" width="176" height="34" rx="7"/><rect x="96" y="320" width="176" height="34" rx="7"/>
  </g>
  <rect x="96" y="228" width="176" height="34" rx="7" fill="rgba(16,185,129,.22)" stroke="rgba(16,185,129,.5)"/>

  <!-- operator bar (floating glass) -->
  <g>
    <rect x="286" y="238" width="700" height="86" rx="20" fill="rgba(6,25,21,.94)" stroke="rgba(16,185,129,.45)" stroke-width="2"/>
    <circle class="dot" cx="326" cy="281" r="6" fill="#34d399"/>
    <text x="352" y="289" font-size="26" fill="#d1fae5" font-family="Inter,Arial,sans-serif">Compress the bass track</text>
    <rect class="caret" x="640" y="264" width="3" height="34" fill="#34d399"/>
    <rect x="880" y="262" width="76" height="38" rx="10" fill="rgba(16,185,129,.16)" stroke="rgba(16,185,129,.4)"/>
    <text x="918" y="287" font-size="15" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" text-anchor="middle">⌥Space</text>
  </g>

  <!-- narrated plan -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="326" y="374" font-size="14" fill="rgba(110,231,183,.75)" letter-spacing="3">PLAN · AWAITING APPROVAL</text>

    <g class="step">
      <rect x="316" y="392" width="640" height="56" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,.08)"/>
      <circle cx="348" cy="420" r="13" fill="rgba(16,185,129,.2)" stroke="rgba(16,185,129,.5)"/>
      <text x="348" y="426" font-size="14" fill="#6ee7b7" text-anchor="middle">1</text>
      <text x="382" y="426" font-size="18" fill="#e6fffa">click</text>
      <text x="446" y="426" font-size="17" fill="rgba(255,255,255,.55)">Select the bass track</text>
    </g>

    <g class="step" style="animation-delay:.5s">
      <rect x="316" y="458" width="640" height="56" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,.08)"/>
      <circle cx="348" cy="486" r="13" fill="rgba(16,185,129,.2)" stroke="rgba(16,185,129,.5)"/>
      <text x="348" y="492" font-size="14" fill="#6ee7b7" text-anchor="middle">2</text>
      <text x="382" y="492" font-size="18" fill="#e6fffa">key</text>
      <text x="446" y="492" font-size="17" fill="rgba(255,255,255,.55)">⌘F — open the audio effects browser</text>
    </g>

    <g class="step" style="animation-delay:1s">
      <rect x="316" y="524" width="640" height="56" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,.08)"/>
      <circle cx="348" cy="552" r="13" fill="rgba(16,185,129,.2)" stroke="rgba(16,185,129,.5)"/>
      <text x="348" y="558" font-size="14" fill="#6ee7b7" text-anchor="middle">3</text>
      <text x="382" y="558" font-size="18" fill="#e6fffa">type</text>
      <text x="446" y="558" font-size="17" fill="rgba(255,255,255,.55)">“Compressor” — find the device</text>
    </g>

    <rect x="316" y="600" width="150" height="42" rx="21" fill="rgba(16,185,129,.9)"/>
    <text x="391" y="627" font-size="16" font-weight="700" fill="#04211c" text-anchor="middle">Approve</text>
    <rect x="480" y="600" width="120" height="42" rx="21" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
    <text x="540" y="627" font-size="16" fill="rgba(255,255,255,.6)" text-anchor="middle">Cancel</text>
    <text x="640" y="627" font-size="14" fill="rgba(255,255,255,.32)">every destructive step is reversible</text>
  </g>

  <!-- local badge -->
  <g font-family="Inter,Arial,sans-serif">
    <rect x="1006" y="180" width="180" height="40" rx="20" fill="rgba(16,185,129,.12)" stroke="rgba(16,185,129,.38)"/>
    <circle class="dot" cx="1034" cy="200" r="5" fill="#34d399"/>
    <text x="1052" y="206" font-size="15" fill="#a7f3d0">runs on-device</text>
  </g>

  <g class="scan" opacity=".05"><rect x="0" y="-140" width="1280" height="140" fill="#34d399"/></g>
</svg>

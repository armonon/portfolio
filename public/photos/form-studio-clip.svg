<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="fbg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1305"/><stop offset="1" stop-color="#0a0806"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <style>
      @keyframes typecmd { 0%,4% { width: 0 } 34%,100% { width: 430px } }
      @keyframes caret3 { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes buildstep { 0%,10% { opacity:.18 } 22%,100% { opacity:1 } }
      @keyframes dimfade { 0%,40% { opacity:0 } 55%,100% { opacity:1 } }
      @keyframes glow4 { 0%,100% { opacity:.14 } 50% { opacity:.3 } }
      @keyframes sweepline { 0% { transform: translateX(0) } 100% { transform: translateX(300px) } }
      .typecmd { animation: typecmd 7s ease-in-out infinite; }
      .caret3 { animation: caret3 1.1s step-end infinite; }
      .step2 { animation: buildstep 7s ease-in-out infinite; }
      .dim { animation: dimfade 7s ease-in-out infinite; }
      .glow4 { animation: glow4 6s ease-in-out infinite; }
      .scanx { animation: sweepline 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .typecmd,.caret3,.step2,.dim,.glow4,.scanx { animation:none; opacity:1; width:430px; transform:none } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#fbg2)"/>
  <g class="glow4"><ellipse cx="620" cy="330" rx="500" ry="250" fill="#f59e0b" opacity=".22"/></g>

  <!-- top bar -->
  <rect x="0" y="0" width="1280" height="54" fill="rgba(255,255,255,.03)"/>
  <line x1="0" y1="54" x2="1280" y2="54" stroke="rgba(255,255,255,.09)"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="28" y="15" width="24" height="24" rx="6" fill="rgba(245,158,11,.22)" stroke="rgba(251,191,36,.5)"/>
    <text x="40" y="32" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle">F</text>
    <text x="64" y="33" font-size="16" font-weight="700" fill="#fde68a" letter-spacing="3">FORM STUDIO</text>
    <text x="1252" y="33" font-size="12" fill="rgba(255,255,255,.32)" text-anchor="end">PRIVATE BETA · NATIVE + WEB</text>
  </g>

  <!-- left: feature tree -->
  <rect x="0" y="54" width="238" height="666" fill="rgba(255,255,255,.022)"/>
  <line x1="238" y1="54" x2="238" y2="720" stroke="rgba(255,255,255,.09)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="26" y="90" font-size="11" fill="rgba(255,255,255,.3)" letter-spacing="2">FEATURE TREE</text>
    <g class="step2">
      <rect x="20" y="104" width="198" height="38" rx="8" fill="rgba(255,255,255,.05)"/>
      <text x="36" y="128" font-size="12" fill="rgba(251,191,36,.75)">01</text>
      <text x="66" y="128" font-size="14" fill="rgba(255,255,255,.72)">Sketch</text>
    </g>
    <g class="step2" style="animation-delay:.7s">
      <rect x="20" y="150" width="198" height="38" rx="8" fill="rgba(255,255,255,.05)"/>
      <text x="36" y="174" font-size="12" fill="rgba(251,191,36,.75)">02</text>
      <text x="66" y="174" font-size="14" fill="rgba(255,255,255,.72)">Extrude</text>
    </g>
    <g class="step2" style="animation-delay:1.4s">
      <rect x="20" y="196" width="198" height="38" rx="8" fill="rgba(245,158,11,.16)" stroke="rgba(251,191,36,.4)"/>
      <text x="36" y="220" font-size="12" fill="#fbbf24">03</text>
      <text x="66" y="220" font-size="14" fill="#fde68a">Fillet</text>
    </g>

    <text x="26" y="284" font-size="11" fill="rgba(255,255,255,.3)" letter-spacing="2">SELECTED FEATURE</text>
    <text x="26" y="310" font-size="15" fill="#fde68a">Buckle frame</text>
    <g font-size="13">
      <text x="26" y="346" fill="rgba(255,255,255,.42)">Width</text><text x="218" y="346" fill="rgba(255,255,255,.8)" text-anchor="end">48.00 mm</text>
      <text x="26" y="378" fill="rgba(255,255,255,.42)">Height</text><text x="218" y="378" fill="rgba(255,255,255,.8)" text-anchor="end">32.00 mm</text>
      <text x="26" y="410" fill="rgba(255,255,255,.42)">Thickness</text><text x="218" y="410" fill="rgba(255,255,255,.8)" text-anchor="end">4.00 mm</text>
    </g>

    <rect x="20" y="446" width="198" height="30" rx="15" fill="rgba(132,204,22,.14)" stroke="rgba(132,204,22,.4)"/>
    <circle cx="42" cy="461" r="4" fill="#a3e635"/>
    <text x="56" y="466" font-size="12" fill="#d9f99d">B-Rep VALID</text>
  </g>

  <!-- viewport -->
  <rect x="268" y="88" width="700" height="474" rx="10" fill="rgba(0,0,0,.34)" stroke="rgba(255,255,255,.08)"/>
  <g stroke="rgba(255,255,255,.045)">
    <line x1="268" y1="206" x2="968" y2="206"/><line x1="268" y1="325" x2="968" y2="325"/><line x1="268" y1="444" x2="968" y2="444"/>
    <line x1="443" y1="88" x2="443" y2="562"/><line x1="618" y1="88" x2="618" y2="562"/><line x1="793" y1="88" x2="793" y2="562"/>
  </g>
  <!-- the part: a bracket with holes -->
  <g>
    <rect x="450" y="240" width="340" height="180" rx="16" fill="url(#metal)" opacity=".92"/>
    <rect x="486" y="276" width="268" height="108" rx="10" fill="#0f0a04" opacity=".82"/>
    <g fill="#0f0a04" opacity=".85">
      <circle cx="486" cy="264" r="11"/><circle cx="754" cy="264" r="11"/>
      <circle cx="486" cy="396" r="11"/><circle cx="754" cy="396" r="11"/>
    </g>
  </g>
  <!-- dimension annotations -->
  <g class="dim" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#fde68a">
    <g stroke="#fbbf24" stroke-width="1.4">
      <line x1="450" y1="212" x2="790" y2="212"/>
      <line x1="450" y1="204" x2="450" y2="220"/><line x1="790" y1="204" x2="790" y2="220"/>
      <line x1="818" y1="240" x2="818" y2="420"/>
      <line x1="810" y1="240" x2="826" y2="240"/><line x1="810" y1="420" x2="826" y2="420"/>
    </g>
    <rect x="578" y="196" width="84" height="24" rx="5" fill="#150e04"/>
    <text x="620" y="213" text-anchor="middle">48.00 mm</text>
    <rect x="836" y="318" width="84" height="24" rx="5" fill="#150e04"/>
    <text x="878" y="335" text-anchor="middle">32.00 mm</text>
  </g>
  <!-- scan sweep -->
  <g class="scanx" opacity=".16"><rect x="290" y="88" width="120" height="474" fill="#fbbf24"/></g>

  <!-- command bar -->
  <g font-family="ui-monospace,Menlo,monospace">
    <rect x="268" y="594" width="700" height="58" rx="12" fill="rgba(12,9,4,.94)" stroke="rgba(251,191,36,.42)"/>
    <text x="294" y="629" font-size="17" fill="rgba(251,191,36,.8)">⌘</text>
    <clipPath id="cmdclip"><rect class="typecmd" x="324" y="608" width="430" height="30"/></clipPath>
    <text x="324" y="630" font-size="16" fill="#fde68a" clip-path="url(#cmdclip)">Make this buckle 2 inches wide, 0.5 mm clearance</text>
    <rect class="caret3" x="756" y="610" width="2" height="26" fill="#fbbf24"/>
    <rect x="908" y="610" width="42" height="26" rx="6" fill="rgba(251,191,36,.18)"/>
    <text x="929" y="628" font-size="14" fill="#fbbf24" text-anchor="middle">↵</text>
  </g>

  <!-- right rail: proof stats -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="1004" y="112" font-size="11" fill="rgba(255,255,255,.3)" letter-spacing="2">EXACT GEOMETRY</text>
    <text x="1004" y="146" font-size="22" fill="#fde68a">OpenCASCADE</text>
    <text x="1004" y="170" font-size="13" fill="rgba(255,255,255,.4)">B-Rep, not mesh</text>

    <line x1="1004" y1="200" x2="1244" y2="200" stroke="rgba(255,255,255,.08)"/>
    <text x="1004" y="234" font-size="11" fill="rgba(255,255,255,.3)" letter-spacing="2">TESTS</text>
    <text x="1004" y="268" font-size="22" fill="#fde68a">200 + 22</text>
    <text x="1004" y="292" font-size="13" fill="rgba(255,255,255,.4)">web + native</text>

    <line x1="1004" y1="322" x2="1244" y2="322" stroke="rgba(255,255,255,.08)"/>
    <text x="1004" y="356" font-size="11" fill="rgba(255,255,255,.3)" letter-spacing="2">MIGRATIONS</text>
    <text x="1004" y="390" font-size="22" fill="#fde68a">V1 — V11</text>
    <text x="1004" y="414" font-size="13" fill="rgba(255,255,255,.4)">project formats</text>

    <line x1="1004" y1="444" x2="1244" y2="444" stroke="rgba(255,255,255,.08)"/>
    <text x="1004" y="478" font-size="11" fill="rgba(255,255,255,.3)" letter-spacing="2">DATA</text>
    <text x="1004" y="512" font-size="22" fill="#fde68a">Local first</text>
    <text x="1004" y="536" font-size="13" fill="rgba(255,255,255,.4)">backups + recovery</text>
  </g>
</svg>

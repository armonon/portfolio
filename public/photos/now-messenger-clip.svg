<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1020"/><stop offset="1" stop-color="#0a0710"/></linearGradient>
    <style>
      @keyframes rise { 0% { opacity:0; transform: translateY(18px) } 100% { opacity:1; transform: translateY(0) } }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .m1 { animation: rise .6s ease-out .1s both; }
      .m2 { animation: rise .6s ease-out .5s both; }
      .m3 { animation: rise .6s ease-out .9s both; }
      .doodle { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 2.4s ease-out .6s forwards; }
      @media (prefers-reduced-motion: reduce){ .m1,.m2,.m3{ animation:none } .doodle{ animation:none; stroke-dashoffset:0 } }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="40" y="40" width="1200" height="640" rx="26" fill="rgba(10,7,16,.6)" stroke="rgba(244,114,182,.25)"/>
  <text x="80" y="116" font-size="40" font-weight="800" fill="#f5f5f4" font-family="Inter,Arial,sans-serif">NOW Messenger</text>
  <text x="82" y="150" font-size="19" fill="#f9a8d4" font-family="Inter,Arial,sans-serif" letter-spacing="2">ROOMS · VIDEO · PICTOCHAT</text>
  <!-- room list -->
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="186" width="300" height="474" rx="18" fill="rgba(255,255,255,.04)" stroke="rgba(244,114,182,.2)"/>
    <text x="108" y="228" font-size="18" font-weight="700" fill="#f9a8d4">Channels</text>
    <rect x="100" y="248" width="260" height="52" rx="12" fill="rgba(244,114,182,.18)"/><text x="124" y="281" font-size="18" fill="#f5f5f4"># late-night-beats</text>
    <rect x="100" y="312" width="260" height="52" rx="12" fill="rgba(255,255,255,.05)"/><text x="124" y="345" font-size="18" fill="#a8a29e"># film-feedback</text>
    <rect x="100" y="376" width="260" height="52" rx="12" fill="rgba(255,255,255,.05)"/><text x="124" y="409" font-size="18" fill="#a8a29e"># design-crit</text>
    <rect x="100" y="440" width="260" height="52" rx="12" fill="rgba(255,255,255,.05)"/><text x="124" y="473" font-size="18" fill="#a8a29e"># random</text>
    <text x="108" y="632" font-size="14" fill="#78716c">Guest join · no email</text>
  </g>
  <!-- messages -->
  <g font-family="Inter,Arial,sans-serif" font-size="19">
    <g class="m1"><rect x="420" y="190" width="400" height="64" rx="20" fill="rgba(255,255,255,.08)"/><text x="446" y="229" fill="#e7e5e4">anyone up for a listening room?</text></g>
    <g class="m2"><rect x="620" y="274" width="420" height="64" rx="20" fill="#be185d"/><text x="646" y="313" fill="#fdf2f8">yes — dropping a track in 5</text></g>
    <g class="m3"><rect x="420" y="358" width="340" height="64" rx="20" fill="rgba(255,255,255,.08)"/><text x="446" y="397" fill="#e7e5e4">sketching the cover now ↓</text></g>
  </g>
  <!-- PictoChat -->
  <rect x="420" y="450" width="560" height="210" rx="16" fill="#fdf2f8"/>
  <path class="doodle" d="M470 600c30-90 60-90 90-20s60 70 90-10 60-90 90-10 50 70 90 0 50-60 70-30" stroke="#be185d" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="446" y="486" font-size="14" fill="#9d174d" font-family="Inter,Arial,sans-serif" letter-spacing="2">PICTOCHAT</text>
  <!-- video tiles -->
  <rect x="1020" y="190" width="180" height="130" rx="16" fill="rgba(244,114,182,.15)" stroke="rgba(244,114,182,.3)"/>
  <circle cx="1110" cy="240" r="22" fill="rgba(244,114,182,.5)"/><rect x="1080" y="268" width="60" height="34" rx="17" fill="rgba(244,114,182,.5)"/>
  <rect x="1020" y="336" width="180" height="130" rx="16" fill="rgba(167,139,250,.15)" stroke="rgba(167,139,250,.3)"/>
  <circle cx="1110" cy="386" r="22" fill="rgba(167,139,250,.5)"/><rect x="1080" y="414" width="60" height="34" rx="17" fill="rgba(167,139,250,.5)"/>
</svg>

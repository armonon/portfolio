<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070a10"/></linearGradient>
    <linearGradient id="subj" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <style>
      @keyframes march { to { stroke-dashoffset: -160 } }
      @keyframes cutout { 0%,20% { opacity:0 } 40%,88% { opacity:1 } 100% { opacity:0 } }
      @keyframes fadebg { 0%,22% { opacity:1 } 44%,88% { opacity:.12 } 100% { opacity:1 } }
      @keyframes think { 0%,18% { opacity:0 } 24%,38% { opacity:1 } 46%,100% { opacity:0 } }
      @keyframes glowpulse { 0%,100% { opacity:.14 } 50% { opacity:.3 } }
      .march { stroke-dasharray: 9 7; animation: march 3s linear infinite; }
      .cut { animation: cutout 6s ease-in-out infinite; }
      .bgfade { animation: fadebg 6s ease-in-out infinite; }
      .think { animation: think 6s ease-in-out infinite; }
      .glow { animation: glowpulse 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .march,.cut,.bgfade,.think,.glow { animation:none; opacity:1 } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#lbg)"/>
  <g class="glow"><ellipse cx="700" cy="330" rx="470" ry="230" fill="#3b82f6" opacity=".2"/></g>

  <!-- top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="rgba(255,255,255,.035)"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="rgba(255,255,255,.09)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="34" y="36" font-size="19" font-weight="800" fill="#60a5fa">LUMA</text>
    <text x="104" y="36" font-size="17" fill="rgba(255,255,255,.35)">Studio</text>
    <g fill="rgba(255,255,255,.42)" font-size="15">
      <text x="196" y="36">New</text><text x="252" y="36">Open</text><text x="316" y="36">Save</text>
      <text x="392" y="36">Import</text><text x="466" y="36">Export</text>
    </g>
    <text x="1246" y="36" font-size="14" fill="rgba(255,255,255,.3)" text-anchor="end">portrait.luma</text>
  </g>

  <!-- left tool palette -->
  <rect x="0" y="56" width="176" height="664" fill="rgba(255,255,255,.025)"/>
  <line x1="176" y1="56" x2="176" y2="720" stroke="rgba(255,255,255,.09)"/>
  <g font-family="Inter,Arial,sans-serif" font-size="12">
    <text x="22" y="88" fill="rgba(255,255,255,.3)" letter-spacing="2">MOVE</text>
    <g fill="rgba(255,255,255,.06)"><rect x="18" y="98" width="66" height="30" rx="7"/><rect x="92" y="98" width="66" height="30" rx="7"/><rect x="18" y="134" width="66" height="30" rx="7"/><rect x="92" y="134" width="66" height="30" rx="7"/></g>
    <g fill="rgba(255,255,255,.6)" font-size="12"><text x="30" y="118">Select</text><text x="106" y="118">Move</text><text x="30" y="154">Nudge</text><text x="104" y="154">Xform</text></g>

    <text x="22" y="196" fill="rgba(255,255,255,.3)" letter-spacing="2">SELECT</text>
    <g fill="rgba(255,255,255,.06)"><rect x="18" y="206" width="66" height="30" rx="7"/><rect x="92" y="206" width="66" height="30" rx="7"/><rect x="18" y="242" width="66" height="30" rx="7"/><rect x="92" y="242" width="66" height="30" rx="7"/></g>
    <g fill="rgba(255,255,255,.6)"><text x="34" y="226">Rect</text><text x="102" y="226">Ellipse</text><text x="32" y="262">Lasso</text><text x="108" y="262">Wand</text></g>

    <text x="22" y="304" fill="rgba(255,255,255,.3)" letter-spacing="2">PAINT</text>
    <g fill="rgba(255,255,255,.06)"><rect x="18" y="314" width="66" height="30" rx="7"/><rect x="92" y="314" width="66" height="30" rx="7"/><rect x="18" y="350" width="66" height="30" rx="7"/><rect x="92" y="350" width="66" height="30" rx="7"/></g>
    <g fill="rgba(255,255,255,.6)"><text x="32" y="334">Brush</text><text x="98" y="334">Gradient</text><text x="32" y="370">Shape</text><text x="110" y="370">Text</text></g>

    <text x="22" y="412" fill="rgba(255,255,255,.3)" letter-spacing="2">AI</text>
    <rect x="18" y="422" width="140" height="34" rx="8" fill="rgba(59,130,246,.9)"/>
    <text x="88" y="444" font-size="13" font-weight="700" fill="#08111f" text-anchor="middle">AI Select Subject</text>
  </g>

  <!-- canvas -->
  <rect x="208" y="92" width="740" height="590" rx="10" fill="rgba(0,0,0,.34)" stroke="rgba(255,255,255,.09)"/>
  <g class="bgfade">
    <rect x="216" y="100" width="724" height="574" rx="8" fill="#1e293b"/>
    <g stroke="rgba(255,255,255,.05)">
      <line x1="216" y1="240" x2="940" y2="240"/><line x1="216" y1="400" x2="940" y2="400"/><line x1="216" y1="540" x2="940" y2="540"/>
      <line x1="420" y1="100" x2="420" y2="674"/><line x1="700" y1="100" x2="700" y2="674"/>
    </g>
  </g>
  <!-- subject -->
  <g>
    <ellipse cx="578" cy="300" rx="88" ry="104" fill="url(#subj)"/>
    <path d="M448 674 C 452 512, 500 434, 578 434 C 656 434, 704 512, 708 674 Z" fill="url(#subj)"/>
  </g>
  <!-- marching-ants selection around subject -->
  <g class="cut">
    <ellipse class="march" cx="578" cy="300" rx="94" ry="110" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <path class="march" d="M442 674 C 446 508, 496 428, 578 428 C 660 428, 710 508, 714 674" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  </g>
  <!-- inference badge -->
  <g class="think" font-family="Inter,Arial,sans-serif">
    <rect x="640" y="128" width="272" height="44" rx="22" fill="rgba(8,17,31,.94)" stroke="rgba(96,165,250,.5)"/>
    <circle cx="668" cy="150" r="6" fill="#60a5fa"/>
    <text x="686" y="156" font-size="15" fill="#bfdbfe">ISNet · running on-device</text>
  </g>

  <!-- right: layers + adjustments -->
  <rect x="972" y="92" width="284" height="590" rx="10" fill="rgba(255,255,255,.025)" stroke="rgba(255,255,255,.08)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="994" y="122" font-size="12" fill="rgba(255,255,255,.32)" letter-spacing="2">LAYERS</text>
    <g>
      <rect x="988" y="134" width="252" height="46" rx="8" fill="rgba(59,130,246,.16)" stroke="rgba(96,165,250,.4)"/>
      <rect x="1000" y="145" width="24" height="24" rx="5" fill="#60a5fa"/>
      <text x="1036" y="162" font-size="14" fill="#dbeafe">Subject</text>
      <text x="1226" y="162" font-size="12" fill="rgba(255,255,255,.35)" text-anchor="end">100%</text>
    </g>
    <g>
      <rect x="988" y="188" width="252" height="46" rx="8" fill="rgba(255,255,255,.04)"/>
      <rect x="1000" y="199" width="24" height="24" rx="5" fill="#475569"/>
      <text x="1036" y="216" font-size="14" fill="rgba(255,255,255,.6)">Backdrop</text>
      <text x="1226" y="216" font-size="12" fill="rgba(255,255,255,.28)" text-anchor="end">88%</text>
    </g>

    <text x="994" y="278" font-size="12" fill="rgba(255,255,255,.32)" letter-spacing="2">ADJUSTMENTS</text>
    <g font-size="14" fill="rgba(255,255,255,.6)">
      <rect x="988" y="290" width="252" height="38" rx="8" fill="rgba(255,255,255,.04)"/><text x="1004" y="314">Curves</text>
      <rect x="988" y="336" width="252" height="38" rx="8" fill="rgba(255,255,255,.04)"/><text x="1004" y="360">Levels</text>
      <rect x="988" y="382" width="252" height="38" rx="8" fill="rgba(255,255,255,.04)"/><text x="1004" y="406">Gradient Map</text>
      <rect x="988" y="428" width="252" height="38" rx="8" fill="rgba(255,255,255,.04)"/><text x="1004" y="452">Black &amp; White</text>
    </g>

    <!-- curve widget -->
    <rect x="988" y="486" width="252" height="170" rx="8" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.07)"/>
    <g stroke="rgba(255,255,255,.07)"><line x1="1030" y1="486" x2="1030" y2="656"/><line x1="1114" y1="486" x2="1114" y2="656"/><line x1="1198" y1="486" x2="1198" y2="656"/><line x1="988" y1="543" x2="1240" y2="543"/><line x1="988" y1="600" x2="1240" y2="600"/></g>
    <path d="M988 656 C 1060 620, 1090 540, 1240 486" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="1114" cy="556" r="6" fill="#dbeafe"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1f2d"/><stop offset="1" stop-color="#06090c"/></linearGradient>
    <style>
      @keyframes fill { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }
      @keyframes pulse { 0%,100% { opacity:.6 } 50% { opacity:1 } }
      .p1 { transform-origin: 0 50%; animation: fill 1.6s cubic-bezier(.16,1,.3,1) .1s both; }
      .p2 { transform-origin: 0 50%; animation: fill 1.6s cubic-bezier(.16,1,.3,1) .4s both; }
      .p3 { transform-origin: 0 50%; animation: fill 1.6s cubic-bezier(.16,1,.3,1) .7s both; }
      .p4 { transform-origin: 0 50%; animation: fill 1.6s cubic-bezier(.16,1,.3,1) 1s both; }
      .go { animation: pulse 2.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .p1,.p2,.p3,.p4,.go{ animation:none } }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="40" y="40" width="1200" height="640" rx="26" fill="rgba(6,9,12,.6)" stroke="rgba(56,189,248,.25)"/>
  <text x="80" y="116" font-size="40" font-weight="800" fill="#f5f5f4" font-family="Inter,Arial,sans-serif">Converter</text>
  <text x="82" y="150" font-size="19" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" letter-spacing="2">GIVE YOUR FILES A NEW FORMAT · ON YOUR DEVICE</text>
  <!-- drop zone -->
  <rect x="80" y="184" width="1120" height="84" rx="16" fill="rgba(56,189,248,.06)" stroke="rgba(56,189,248,.4)" stroke-dasharray="10 8"/>
  <text x="640" y="234" font-size="22" text-anchor="middle" fill="#bae6fd" font-family="Inter,Arial,sans-serif">Drop files here — images, documents, spreadsheets, audio, video, archives</text>
  <!-- queue -->
  <g font-family="Inter,Arial,sans-serif" font-size="20" fill="#e7e5e4">
    <rect x="80" y="296" width="1120" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)"/>
    <text x="108" y="338">photo.png</text><text x="330" y="338" fill="#7dd3fc">→ WebP</text>
    <rect x="560" y="322" width="400" height="10" rx="5" fill="rgba(255,255,255,.08)"/><rect class="p1" x="560" y="322" width="400" height="10" rx="5" fill="#38bdf8"/>
    <text x="1180" y="338" text-anchor="end" fill="#6ee7b7">Done</text>
    <rect x="80" y="376" width="1120" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)"/>
    <text x="108" y="418">scan.pdf</text><text x="330" y="418" fill="#7dd3fc">→ Text (OCR)</text>
    <rect x="560" y="402" width="400" height="10" rx="5" fill="rgba(255,255,255,.08)"/><rect class="p2" x="560" y="402" width="400" height="10" rx="5" fill="#38bdf8"/>
    <text x="1180" y="418" text-anchor="end" fill="#6ee7b7">Done</text>
    <rect x="80" y="456" width="1120" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)"/>
    <text x="108" y="498">budget.xlsx</text><text x="330" y="498" fill="#7dd3fc">→ CSV</text>
    <rect x="560" y="482" width="400" height="10" rx="5" fill="rgba(255,255,255,.08)"/><rect class="p3" x="560" y="482" width="400" height="10" rx="5" fill="#38bdf8"/>
    <text x="1180" y="498" text-anchor="end" fill="#6ee7b7">Done</text>
    <rect x="80" y="536" width="1120" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)"/>
    <text x="108" y="578">mix.wav</text><text x="330" y="578" fill="#7dd3fc">→ MP3</text>
    <rect x="560" y="562" width="400" height="10" rx="5" fill="rgba(255,255,255,.08)"/><rect class="p4" x="560" y="562" width="280" height="10" rx="5" fill="#38bdf8"/>
    <text x="1180" y="578" text-anchor="end" fill="#a8a29e">70%</text>
  </g>
  <rect class="go" x="80" y="626" width="200" height="34" rx="17" fill="#38bdf8"/>
  <text x="180" y="649" font-size="16" font-weight="700" text-anchor="middle" fill="#04202e" font-family="Inter,Arial,sans-serif">Convert all</text>
  <text x="304" y="649" font-size="16" fill="#78716c" font-family="Inter,Arial,sans-serif">No file uploads — conversions happen on your device</text>
</svg>

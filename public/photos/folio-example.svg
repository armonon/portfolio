<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#07090d"/></linearGradient>
    <style>
      @keyframes type { 0% { width: 0 } 55%,100% { width: 430px } }
      @keyframes caret2 { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes save { 0%,55% { opacity:0 } 65%,90% { opacity:1 } 100% { opacity:0 } }
      @keyframes float2 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .typing { animation: type 6s ease-in-out infinite; }
      .caret2 { animation: caret2 1.1s step-end infinite; }
      .saved { animation: save 6s ease-in-out infinite; }
      .float2 { animation: float2 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .typing,.caret2,.saved,.float2 { animation: none; opacity: 1; transform: none; width: 430px } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#fbg)"/>
  <ellipse cx="900" cy="180" rx="440" ry="220" fill="#6366f1" opacity=".1"/>

  <!-- sidebar -->
  <rect x="70" y="80" width="300" height="560" rx="18" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.07)"/>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="110" cy="122" r="16" fill="rgba(99,102,241,.25)" stroke="rgba(129,140,248,.5)"/>
    <text x="110" y="128" font-size="16" font-weight="700" fill="#c7d2fe" text-anchor="middle">F</text>
    <text x="138" y="128" font-size="21" font-weight="700" fill="#e5e7eb">Folio</text>
    <rect x="196" y="110" width="52" height="22" rx="11" fill="rgba(99,102,241,.16)" stroke="rgba(129,140,248,.35)"/>
    <text x="222" y="126" font-size="11" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">BETA</text>

    <rect x="94" y="164" width="252" height="42" rx="10" fill="rgba(99,102,241,.16)" stroke="rgba(129,140,248,.35)"/>
    <text x="116" y="191" font-size="16" fill="#c7d2fe">＋  New document</text>
    <rect x="94" y="216" width="252" height="42" rx="10" fill="rgba(255,255,255,.04)"/>
    <text x="116" y="243" font-size="16" fill="rgba(255,255,255,.55)">↥  Import a draft</text>

    <text x="96" y="298" font-size="12" fill="rgba(255,255,255,.3)" letter-spacing="2">DOCUMENTS</text>
    <g fill="rgba(255,255,255,.04)">
      <rect x="94" y="314" width="252" height="36" rx="8"/>
      <rect x="94" y="358" width="252" height="36" rx="8"/>
      <rect x="94" y="402" width="252" height="36" rx="8"/>
    </g>
    <g font-size="15" fill="rgba(255,255,255,.62)">
      <text x="114" y="338">Launch notes</text>
      <text x="114" y="382">Client brief — v2</text>
      <text x="114" y="426">Research summary</text>
    </g>
    <g fill="rgba(129,140,248,.7)" font-size="12">
      <text x="300" y="338">◇</text><text x="300" y="382">⇄</text><text x="300" y="426">⇄</text>
    </g>
  </g>

  <!-- document canvas -->
  <rect x="400" y="80" width="810" height="560" rx="18" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.07)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="446" y="150" font-size="34" font-weight="700" fill="#f3f4f6">Launch notes</text>

    <!-- typing line with clip -->
    <clipPath id="clip1"><rect class="typing" x="446" y="182" width="430" height="26"/></clipPath>
    <text x="446" y="202" font-size="19" fill="rgba(255,255,255,.66)" clip-path="url(#clip1)">Folio keeps your team's thinking in one calm place.</text>
    <rect class="caret2" x="878" y="182" width="2" height="24" fill="#a5b4fc"/>

    <g fill="rgba(255,255,255,.09)">
      <rect x="446" y="232" width="700" height="12" rx="6"/>
      <rect x="446" y="258" width="660" height="12" rx="6"/>
      <rect x="446" y="284" width="712" height="12" rx="6"/>
      <rect x="446" y="322" width="520" height="12" rx="6"/>
      <rect x="446" y="348" width="640" height="12" rx="6"/>
    </g>

    <!-- collaborator cursor -->
    <g class="float2">
      <path d="M980 400 L980 436 L991 427 L998 442 L1006 438 L999 423 L1012 422 Z" fill="#818cf8"/>
      <rect x="1012" y="404" width="86" height="26" rx="7" fill="#6366f1"/>
      <text x="1055" y="422" font-size="13" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Alex</text>
    </g>
    <g fill="rgba(129,140,248,.16)"><rect x="446" y="398" width="520" height="14" rx="7"/></g>

    <g fill="rgba(255,255,255,.09)">
      <rect x="446" y="440" width="690" height="12" rx="6"/>
      <rect x="446" y="466" width="600" height="12" rx="6"/>
    </g>

    <!-- autosave pill -->
    <g class="saved">
      <rect x="960" y="580" width="204" height="34" rx="17" fill="rgba(16,185,129,.14)" stroke="rgba(16,185,129,.38)"/>
      <circle cx="986" cy="597" r="5" fill="#34d399"/>
      <text x="1002" y="602" font-size="14" fill="#a7f3d0">All changes saved</text>
    </g>
  </g>
</svg>

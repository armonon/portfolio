<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1005"/><stop offset="1" stop-color="#0a0705"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.08)"/><stop offset="1" stop-color="rgba(255,255,255,.025)"/></linearGradient>
    <style>
      @keyframes rise { 0%,6% { opacity:0; transform: translateY(14px) } 20%,100% { opacity:1; transform: translateY(0) } }
      @keyframes breathe { 0%,100% { opacity:.16 } 50% { opacity:.36 } }
      @keyframes dashspin { to { stroke-dashoffset: -220 } }
      @keyframes blip { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      .rise { animation: rise 6s ease-out infinite; }
      .breathe { animation: breathe 5s ease-in-out infinite; }
      .link { stroke-dasharray: 6 10; animation: dashspin 6s linear infinite; }
      .blip { animation: blip 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .rise,.breathe,.link,.blip { animation:none; opacity:1; transform:none } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#mbg)"/>
  <g class="breathe"><ellipse cx="640" cy="360" rx="560" ry="260" fill="#f59e0b" opacity=".22"/></g>

  <!-- header -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="640" y="92" font-size="38" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="4">MOMENTOUS</text>
    <text x="640" y="126" font-size="17" fill="rgba(253,230,138,.6)" text-anchor="middle">A directory, not a middleman</text>
  </g>

  <!-- two circles -->
  <circle cx="440" cy="392" r="196" fill="none" stroke="rgba(245,158,11,.32)" stroke-width="2"/>
  <circle cx="840" cy="392" r="196" fill="none" stroke="rgba(244,114,182,.3)" stroke-width="2"/>
  <path class="link" d="M636 392 H644" stroke="rgba(255,255,255,.4)" stroke-width="0" />
  <line class="link" x1="540" y1="392" x2="740" y2="392" stroke="rgba(255,255,255,.35)" stroke-width="2"/>

  <!-- left: apps -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="440" y="236" font-size="14" fill="rgba(245,158,11,.85)" text-anchor="middle" letter-spacing="4">APPS · IN-HOUSE</text>

    <g class="rise">
      <rect x="316" y="258" width="248" height="60" rx="13" fill="url(#card)" stroke="rgba(245,158,11,.3)"/>
      <circle class="blip" cx="346" cy="288" r="5" fill="#fbbf24"/>
      <text x="366" y="284" font-size="17" fill="#fef3c7">ScenePilot</text>
      <text x="366" y="304" font-size="12" fill="rgba(255,255,255,.4)">v0.1.6 · macOS, Web</text>
    </g>
    <g class="rise" style="animation-delay:.45s">
      <rect x="316" y="330" width="248" height="60" rx="13" fill="url(#card)" stroke="rgba(245,158,11,.3)"/>
      <circle class="blip" cx="346" cy="360" r="5" fill="#fbbf24" style="animation-delay:.4s"/>
      <text x="366" y="356" font-size="17" fill="#fef3c7">Photobooth Studio</text>
      <text x="366" y="376" font-size="12" fill="rgba(255,255,255,.4)">v0.7.0 · macOS, Web</text>
    </g>
    <g class="rise" style="animation-delay:.9s">
      <rect x="316" y="402" width="248" height="60" rx="13" fill="url(#card)" stroke="rgba(245,158,11,.3)"/>
      <circle class="blip" cx="346" cy="432" r="5" fill="#fbbf24" style="animation-delay:.8s"/>
      <text x="366" y="428" font-size="17" fill="#fef3c7">StemDeck</text>
      <text x="366" y="448" font-size="12" fill="rgba(255,255,255,.4)">Four decks · live stems</text>
    </g>
  </g>

  <!-- right: stores -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="840" y="236" font-size="14" fill="rgba(244,114,182,.85)" text-anchor="middle" letter-spacing="4">STORES · LISTED</text>

    <g class="rise" style="animation-delay:.2s">
      <rect x="716" y="258" width="248" height="60" rx="13" fill="url(#card)" stroke="rgba(244,114,182,.28)"/>
      <rect x="732" y="274" width="30" height="30" rx="8" fill="rgba(244,114,182,.2)" stroke="rgba(244,114,182,.4)"/>
      <text x="747" y="294" font-size="12" fill="#fbcfe8" text-anchor="middle">BTR</text>
      <text x="776" y="284" font-size="17" fill="#fce7f3">Break Thy Rule</text>
      <text x="776" y="304" font-size="12" fill="rgba(255,255,255,.4)">Streetwear</text>
    </g>
    <g class="rise" style="animation-delay:.65s">
      <rect x="716" y="330" width="248" height="60" rx="13" fill="url(#card)" stroke="rgba(244,114,182,.28)"/>
      <rect x="732" y="346" width="30" height="30" rx="8" fill="rgba(244,114,182,.2)" stroke="rgba(244,114,182,.4)"/>
      <text x="747" y="366" font-size="12" fill="#fbcfe8" text-anchor="middle">SM</text>
      <text x="776" y="356" font-size="17" fill="#fce7f3">Sattari Music</text>
      <text x="776" y="376" font-size="12" fill="rgba(255,255,255,.4)">Instruments &amp; gear</text>
    </g>
    <g class="rise" style="animation-delay:1.1s">
      <rect x="716" y="402" width="248" height="60" rx="13" fill="url(#card)" stroke="rgba(244,114,182,.28)"/>
      <rect x="732" y="418" width="30" height="30" rx="8" fill="rgba(244,114,182,.2)" stroke="rgba(244,114,182,.4)"/>
      <text x="747" y="438" font-size="12" fill="#fbcfe8" text-anchor="middle">MNR</text>
      <text x="776" y="428" font-size="17" fill="#fce7f3">MNR — Spirit Coins</text>
      <text x="776" y="448" font-size="12" fill="rgba(255,255,255,.4)">Art on natural cloth</text>
    </g>
  </g>

  <!-- footer note -->
  <g font-family="Inter,Arial,sans-serif">
    <rect x="452" y="596" width="376" height="46" rx="23" fill="rgba(0,0,0,.4)" stroke="rgba(255,255,255,.12)"/>
    <text x="640" y="625" font-size="16" fill="rgba(255,255,255,.62)" text-anchor="middle">Each store keeps its own checkout</text>
  </g>
</svg>

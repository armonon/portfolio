<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241a08"/><stop offset="1" stop-color="#0a0805"/></linearGradient>
    <style>
      @keyframes rise { 0% { opacity:0; transform: translateY(16px) } 100% { opacity:1; transform: translateY(0) } }
      .c1 { animation: rise .6s ease-out .1s both; }
      .c2 { animation: rise .6s ease-out .35s both; }
      .c3 { animation: rise .6s ease-out .6s both; }
      @media (prefers-reduced-motion: reduce){ .c1,.c2,.c3{ animation:none } }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="40" y="40" width="1200" height="640" rx="26" fill="rgba(10,8,5,.6)" stroke="rgba(251,191,36,.25)"/>
  <text x="80" y="116" font-size="40" font-weight="800" fill="#f5f5f4" font-family="Inter,Arial,sans-serif">The Circle</text>
  <text x="82" y="150" font-size="19" fill="#fcd34d" font-family="Inter,Arial,sans-serif" letter-spacing="2">ONE FEED · PROFILES · PROJECTS · COLLECTIONS</text>
  <!-- filters -->
  <g font-family="Inter,Arial,sans-serif" font-size="16">
    <rect x="80" y="184" width="66" height="36" rx="18" fill="#fbbf24"/><text x="113" y="208" text-anchor="middle" fill="#1c1303" font-weight="700">All</text>
    <rect x="158" y="184" width="86" height="36" rx="18" fill="rgba(255,255,255,.07)"/><text x="201" y="208" text-anchor="middle" fill="#d6d3d1">Circle</text>
    <rect x="256" y="184" width="108" height="36" rx="18" fill="rgba(255,255,255,.07)"/><text x="310" y="208" text-anchor="middle" fill="#d6d3d1">Instagram</text>
    <rect x="376" y="184" width="46" height="36" rx="18" fill="rgba(255,255,255,.07)"/><text x="399" y="208" text-anchor="middle" fill="#d6d3d1">X</text>
    <rect x="434" y="184" width="96" height="36" rx="18" fill="rgba(255,255,255,.07)"/><text x="482" y="208" text-anchor="middle" fill="#d6d3d1">YouTube</text>
  </g>
  <!-- feed cards -->
  <g font-family="Inter,Arial,sans-serif">
    <g class="c1"><rect x="80" y="252" width="360" height="400" rx="18" fill="rgba(255,255,255,.04)" stroke="rgba(251,191,36,.22)"/>
      <circle cx="116" cy="292" r="18" fill="rgba(251,191,36,.35)"/><text x="148" y="298" font-size="18" font-weight="600" fill="#f5f5f4">new track</text>
      <rect x="104" y="332" width="312" height="190" rx="12" fill="rgba(251,191,36,.12)"/>
      <path d="M130 430h40M180 410v40M196 396v68M212 416v28M228 400v60M244 420v20M260 404v52M276 418v24M292 408v44M308 424v12" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
      <text x="104" y="568" font-size="17" fill="#d6d3d1">Shared to the community feed</text></g>
    <g class="c2"><rect x="460" y="252" width="360" height="400" rx="18" fill="rgba(255,255,255,.04)" stroke="rgba(56,189,248,.22)"/>
      <circle cx="496" cy="292" r="18" fill="rgba(56,189,248,.35)"/><text x="528" y="298" font-size="18" font-weight="600" fill="#f5f5f4">collection</text>
      <rect x="484" y="332" width="150" height="150" rx="12" fill="rgba(56,189,248,.14)"/><rect x="646" y="332" width="150" height="150" rx="12" fill="rgba(167,139,250,.14)"/>
      <rect x="484" y="494" width="150" height="100" rx="12" fill="rgba(52,211,153,.14)"/><rect x="646" y="494" width="150" height="100" rx="12" fill="rgba(251,146,60,.14)"/>
      <text x="484" y="628" font-size="17" fill="#d6d3d1">Projects curated by members</text></g>
    <g class="c3"><rect x="840" y="252" width="360" height="400" rx="18" fill="rgba(255,255,255,.04)" stroke="rgba(244,114,182,.22)"/>
      <circle cx="876" cy="292" r="18" fill="rgba(244,114,182,.35)"/><text x="908" y="298" font-size="18" font-weight="600" fill="#f5f5f4">discussion</text>
      <rect x="864" y="332" width="312" height="52" rx="14" fill="rgba(255,255,255,.07)"/>
      <rect x="864" y="398" width="260" height="52" rx="14" fill="rgba(255,255,255,.07)"/>
      <rect x="896" y="464" width="280" height="52" rx="14" fill="rgba(244,114,182,.3)"/>
      <rect x="864" y="530" width="220" height="52" rx="14" fill="rgba(255,255,255,.07)"/>
      <text x="864" y="628" font-size="17" fill="#d6d3d1">Conversations in one place</text></g>
  </g>
</svg>
